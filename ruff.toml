target-version = "py310"
line-length = 130

[lint]
select = ["E", "F", "W", "B", "PL"]
ignore = ["E501", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004", "PLW0603", "PLC0415", "PLR1714", "B905"]

[lint.per-file-ignores]
"poc" = ["E402"]  # the launcher puts pocctl on sys.path before importing it
